services:
  api-tests:
    build:
      context: .
    environment:
      # Fail fast with a readable message rather than silently defaulting to
      # localhost. Values come from the shell, from .env, or from CI secrets.
      URL: ${URL:?set URL to the API base, e.g. https://tasks.example.com}
      UI_USERNAME: ${UI_USERNAME:?set UI_USERNAME}
      UI_PASSWORD: ${UI_PASSWORD:?set UI_PASSWORD}
    extra_hosts:
      # Lets URL=http://host.docker.internal:8080 reach a server running
      # on the host machine rather than inside the compose network.
      - "host.docker.internal:host-gateway"
    volumes:
      # Surefire XML/TXT reports surface on the host for CI artifact upload.
      - ./testing/selenium/target/surefire-reports:/tests/target/surefire-reports
      # Named volume keeps ~/.m2 warm between runs.
      - maven-repo:/root/.m2

volumes:
  maven-repo:
